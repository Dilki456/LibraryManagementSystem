<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - User Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Top Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-book-bookmark text-indigo-400 text-2xl"></i>
            <span class="font-bold text-xl tracking-wide text-white">Library User Portal</span>
        </div>
        <div id="userInfoNav" class="hidden flex items-center space-x-4">
            <span id="userRoleBadge" class="bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/30"></span>
            <span id="userEmailSpan" class="text-sm font-medium text-slate-300"></span>
            <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-right-from-bracket text-red-400"></i> Logout
            </button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6">

        <!-- Notification Alert -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

        <!-- AUTH SECTION (LOGIN / REGISTER) -->
        <div id="authSection" class="max-w-md mx-auto mt-10">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
                
                <!-- Auth Tabs -->
                <div class="flex border-b border-slate-700 mb-6">
                    <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 transition">Login</button>
                    <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition">Register</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                        <input type="email" id="loginEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-md shadow-indigo-600/30">Sign In</button>
                </form>

                <!-- REGISTER FORM -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                        <input type="text" id="regFullName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                        <input type="email" id="regEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="regPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Phone</label>
                        <input type="tel" id="regPhone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Role</label>
                        <select id="regRole" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="MEMBER">Member</option>
                            <option value="LIBRARIAN">Librarian</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-md shadow-indigo-600/30">Create Account</button>
                </form>

            </div>
        </div>

        <!-- DASHBOARD SECTION (MANAGEMENT BOARD) -->
        <div id="dashboardSection" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <div>
                    <h1 class="text-2xl font-bold text-white">Registered Users Directory</h1>
                    <p class="text-sm text-slate-400 mt-0.5">Manage and view system user records and permissions</p>
                </div>
                <button onclick="fetchUsers()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh List
                </button>
            </div>

            <!-- Users Table -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-700">
                            <th class="py-4 px-6">User ID</th>
                            <th class="py-4 px-6">Name</th>
                            <th class="py-4 px-6">Email</th>
                            <th class="py-4 px-6">Phone</th>
                            <th class="py-4 px-6">Role</th>
                            <th class="py-4 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Dynamic User Rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-white">Update User Profile</h3>
            <input type="hidden" id="editUserId">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Full Name</label>
                <input type="text" id="editFullName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Phone</label>
                <input type="text" id="editPhone" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Role</label>
                <select id="editRole" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100">
                    <option value="MEMBER">MEMBER</option>
                    <option value="LIBRARIAN">LIBRARIAN</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm">Cancel</button>
                <button onclick="saveUserUpdate()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-semibold">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- JavaScript REST Logic -->
     <script>
// Target backend port or API Gateway URL
const API_BASE = 'http://localhost:8083'; 
const API_KEY = 'my-secret-key-123'; // Added missing API_KEY declaration

// Check existing session on initial page load
document.addEventListener("DOMContentLoaded", () => {
    const token = localStorage.getItem("jwtToken");
    if (token) {
        showDashboard();
    } else {
        showAuth();
    }
});

function showAlert(message, type = "success") {
    const alert = document.getElementById("alertBox");
    alert.className = `mb-6 p-4 rounded-xl text-sm font-medium transition-all ${
        type === "success" 
            ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" 
            : "bg-rose-500/10 text-rose-400 border border-rose-500/20"
    }`;
    alert.innerText = message;
    alert.classList.remove("hidden");
    setTimeout(() => alert.classList.add("hidden"), 4000);
}

function switchAuthTab(tab) {
    if (tab === 'login') {
        document.getElementById("loginForm").classList.remove("hidden");
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("tabLogin").className = "flex-1 pb-3 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 transition";
        document.getElementById("tabRegister").className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
    } else {
        document.getElementById("registerForm").classList.remove("hidden");
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("tabRegister").className = "flex-1 pb-3 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 transition";
        document.getElementById("tabLogin").className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY 
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
            const token = data.token || data.accessToken || data.jwt;
            
            if (!token) {
                showAlert("Login succeeded but no token received from backend.", "error");
                return;
            }

            localStorage.setItem("jwtToken", token);
            localStorage.setItem("userEmail", data.email || email);
            localStorage.setItem("userRole", data.role || "MEMBER");
            
            showDashboard();
            showAlert("Logged in successfully!");
        } else {
            showAlert(data.message || "Invalid credentials", "error");
        }
    } catch (err) {
        showAlert("Unable to connect to server", "error");
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById("regFullName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;
    const phone = document.getElementById("regPhone").value;
    const role = document.getElementById("regRole").value;

    try {
        const res = await fetch(`${API_BASE}/auth/register`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY 
            },
            body: JSON.stringify({ fullName, email, password, phone, role })
        });

        if (res.ok) {
            showAlert("Registration successful! Please login.");
            switchAuthTab("login");
        } else {
            const data = await res.json();
            showAlert(data.message || "Registration failed", "error");
        }
    } catch (err) {
        showAlert("Server error during registration", "error");
    }
}

function showDashboard() {
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("dashboardSection").classList.remove("hidden");
    document.getElementById("userInfoNav").classList.remove("hidden");
    
    document.getElementById("userEmailSpan").innerText = localStorage.getItem("userEmail") || "";
    document.getElementById("userRoleBadge").innerText = localStorage.getItem("userRole") || "MEMBER";
    
    fetchUsers();
}

function showAuth() {
    document.getElementById("authSection").classList.remove("hidden");
    document.getElementById("dashboardSection").classList.add("hidden");
    document.getElementById("userInfoNav").classList.add("hidden");
}

function logout() {
    localStorage.clear();
    showAuth();
    showAlert("Logged out successfully.");
}

// Single Consolidated fetchUsers Function
async function fetchUsers() {
    const token = localStorage.getItem("jwtToken");
    
    if (!token) {
        showAuth();
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/users`, {
            headers: { 
                "Authorization": `Bearer ${token}`,
                "X-API-KEY": API_KEY 
            }
        });

        if (res.ok) {
            const users = await res.json();
            renderUserTable(users);
        } else if (res.status === 403 || res.status === 401) {
            console.error("Authentication failed during fetchUsers. Status:", res.status);
            showAlert("Session invalid or unauthorized access.", "error");
            logout();
        }
    } catch (err) {
        showAlert("Failed to load users", "error");
    }
}

function renderUserTable(users) {
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";

    if (!Array.isArray(users) || users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No users found in database</td></tr>`;
        return;
    }

    users.forEach(u => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-700/30 transition";
        tr.innerHTML = `
            <td class="py-4 px-6 text-xs text-slate-400 font-mono">${u.id || '-'}</td>
            <td class="py-4 px-6 font-semibold text-slate-100">${u.fullName || u.name || '-'}</td>
            <td class="py-4 px-6 text-slate-300">${u.email || '-'}</td>
            <td class="py-4 px-6 text-slate-400">${u.phone || '-'}</td>
            <td class="py-4 px-6">
                <span class="bg-slate-700 text-indigo-300 text-xs px-2.5 py-1 rounded-md border border-slate-600 font-medium">${u.role || 'MEMBER'}</span>
            </td>
            <td class="py-4 px-6 text-right space-x-2">
                <button onclick="openEditModal('${u.id}', '${u.fullName || u.name}', '${u.phone}', '${u.role}')" class="p-2 text-indigo-400 hover:bg-slate-700 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                <button onclick="deleteUser('${u.id}')" class="p-2 text-rose-400 hover:bg-slate-700 rounded-lg"><i class="fa-solid fa-trash"></i></button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function openEditModal(id, name, phone, role) {
    document.getElementById("editUserId").value = id;
    document.getElementById("editFullName").value = (name && name !== 'undefined') ? name : '';
    document.getElementById("editPhone").value = (phone && phone !== 'undefined') ? phone : '';
    document.getElementById("editRole").value = (role && role !== 'undefined') ? role : 'MEMBER';
    document.getElementById("editModal").classList.remove("hidden");
}

function closeEditModal() {
    document.getElementById("editModal").classList.add("hidden");
}

async function saveUserUpdate() {
    const id = document.getElementById("editUserId").value;
    const fullName = document.getElementById("editFullName").value;
    const phone = document.getElementById("editPhone").value;
    const role = document.getElementById("editRole").value;
    const token = localStorage.getItem("jwtToken");

    try {
        const res = await fetch(`${API_BASE}/users/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`,
                "X-API-KEY": API_KEY
            },
            body: JSON.stringify({ fullName, phone, role })
        });

        if (res.ok) {
            showAlert("User profile updated!");
            closeEditModal();
            fetchUsers();
        } else {
            showAlert("Failed to update user", "error");
        }
    } catch (err) {
        showAlert("Error connecting to server", "error");
    }
}

async function deleteUser(id) {
    if (!confirm("Are you sure you want to delete this user?")) return;
    const token = localStorage.getItem("jwtToken");

    try {
        const res = await fetch(`${API_BASE}/users/${id}`, {
            method: "DELETE",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "X-API-KEY": API_KEY 
            }
        });

        if (res.ok) {
            showAlert("User deleted successfully!");
            fetchUsers();
        } else {
            showAlert("Failed to delete user", "error");
        }
    } catch (err) {
        showAlert("Error connecting to server", "error");
    }
}
</script>
</body>
</html>
