version: '3.8'

services:

  mongodb:
    image: mongo:8.0
    container_name: library-mongodb
    restart: always
    ports:
      - "27017:27017"

  book-service:
    build: ./book-service
    container_name: book-service
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/library_db